# Images: on the plant server, deploy/server/cv-update sets CV_VERSION (in .env) to a release label and
# downloads the ready-made images GitHub built for it (.github/workflows/release.yml). Without
# CV_VERSION (a developer PC) the tag is "dev" and `docker compose build` builds them locally.
services:
  pipeline:
    build:
      context: .
      dockerfile: deploy/pipeline.Dockerfile
    image: ${PIPELINE_REPO:-ghcr.io/redhaiwnl/clinker-vision-pipeline}:${CV_VERSION:-dev}
    command: ["-config", "/etc/clinker-vision/config.yaml"]
    environment:
      # In-container listener must be 0.0.0.0 or Docker NAT to the container
      # IP gets RST. Host exposure stays localhost-only via the port publish
      # below (127.0.0.1:...:8080). Bare-metal `go run` keeps config 127.0.0.1.
      - PIPELINE_BIND_ADDRESS=0.0.0.0
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      - ./config/config.yaml:/etc/clinker-vision/config.yaml:ro
      - ./data:/srv/clinker-vision/data
      - ./evidence:/srv/clinker-vision/evidence
      - ./logs:/srv/clinker-vision/logs
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    depends_on:
      model:
        condition: service_healthy

  model:
    build:
      context: ./godet-damage-detector-model
      dockerfile: Dockerfile
    image: ${MODEL_REPO:-ghcr.io/redhaiwnl/clinker-vision-model}:${CV_VERSION:-dev}
    command: ["python", "-m", "src.server", "--bind", "0.0.0.0:50051", "--bundle-dir", "/app/model", "--cam4-bundle-dir", "/app/model/cam4", "--sideplate-bundle-dir", "/app/model/cam3", "--sideplate-bundle-dir", "/app/model/cam1new", "--store-path", "/app/state/store.db", "--model-build", "${CV_VERSION:-dev}"]
    environment:
      # TEST-ONLY daylight smoke-test bypass (unset/0 = production behavior).
      # When 1, the model relaxes the template-lost self-test so a day feed
      # flows through the stack. Detections/alerts in this mode are MEANINGLESS.
      - SMOKE_TEST_RELAX_TEMPLATE=${SMOKE_TEST_RELAX_TEMPLATE:-0}
      # wheel alert limits set in the web page (written by the pipeline, read at each evaluation)
      - CV_SETTINGS=/app/pipeline-data/settings.json
    expose:
      - "50051"
    volumes:
      # the calibration bundles are inside the image (/app/model): a version is code + models
      - ./model-state:/app/state
      - ./data:/app/pipeline-data:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${MODEL_MEMORY_LIMIT:-2g}
    cpus: ${MODEL_CPUS:-2}
    healthcheck:
      # Liveness only (TCP listening). Loop-lock readiness is separate via
      # GetGodetState.health.ready -> pipeline /health/ready.
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',50051),2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks:
      - default
    restart: unless-stopped

networks:
  default:
    name: clinker-vision
