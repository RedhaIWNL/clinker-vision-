syntax = "proto3";
package clinkervision.inference.v2;

import "google/protobuf/timestamp.proto";

// Model service: dense-frames-in, per-frame measurements (Tier 1) + per-godet
// damage state (Tier 2). Contract v0.3 (accepted). BACKWARD-INCOMPATIBLE with v1:
// v1 stubs must be regenerated against this file and imports repointed to
// clinkervision.inference.v2.
service InferenceService {
  // Bidi stream, one persistent stream per inference worker. frame_id correlates
  // request/response; per-camera order is by sequence_no (see reorder window:
  // 64 frames; later arrivals are counted late and NOT processed).
  // Per-frame input errors (bad JPEG / unknown camera / oversized) do NOT abort
  // the stream: the frame is dead-lettered (logged + counted) and gets NO
  // response. Only server-side failures abort the stream (UNAVAILABLE, etc.).
  rpc Infer(stream InferenceRequest) returns (stream InferenceResponse);
  // Tier 2: the actual product. Per-godet state over identity + history.
  rpc GetGodetState(GodetStateRequest) returns (GodetStateResponse);
}

message InferenceRequest {
  string frame_id = 1;   // UUID per frame, generated by pipeline. Echoed exactly.
  string camera_id = 2;  // CAM-1 for MVP; anything else -> INVALID_ARGUMENT.
  bytes image_data = 3;  // dense full-frame JPEG, FFmpeg MJPEG -q:v 3,
                         // max 8 MB (or ROI+gate crops iff the §1 carve-out
                         // is signed). Must decode via OpenCV.
  google.protobuf.Timestamp captured_at = 4;  // source/decode capture time, not send time.
  uint64 sequence_no = 5;  // contiguous per camera_id; gaps = drops (virtual slots).
}

message InferenceResponse {
  string frame_id = 1;
  // Compatibility ROI indicator (fixed box, identical on every detection) or
  // empty. Tier-1 responses are measurements, NEVER alerts: pipeline must not
  // render them to operators.
  repeated Detection detections = 2;
  // Pinned scalar keys: lit_L, lit_R, peak, dx, dy, slot, status_code.
  // status_code: readable=0, weak=1, edge=2, occluded=3.
  // Non-capture frames carry match scalars with slot = -1 (no godet reading).
  map<string, float> scalar_measurements = 3;
  string model_version = 4;  // <template-sha8>+<service-git-sha8>+<thresholds-id>
  google.protobuf.Timestamp processed_at = 5;
}

message Detection {
  string observation_target = 1;  // "GODET" (MVP)
  string fault_type = 2;          // "DAMAGE" = short/bent wing lip (MVP)
  // confidence intentionally absent until a mapping is signed — no fake 0-1.
  BoundingBox bounding_box = 4;   // fixed ROI indicator, normalized 0-1.
}

// Fixed ROI indicator for 2688x1520 CAM-1 night ROI (x1023/y176/w144/h258):
// x=0.3806 y=0.1158 width=0.0536 height=0.1697. Identical on every detection:
// an ROI indicator, NOT a localized box.
message BoundingBox { float x = 1; float y = 2; float width = 3; float height = 4; }

message GodetStateRequest { repeated int32 godet_ids = 1; bool include_history = 2; }
message GodetStateResponse {
  string model_version = 1;
  repeated GodetState godets = 2;
  Health health = 3;
  repeated GodetAlertEvent events = 4;  // replayable Tier-2 state changes
}
message GodetState {
  int32 godet_id = 1;
  // healthy | suspect | persistent | pending | confirmed
  string state = 2;
  float lip = 3;
  bool near_plate = 4;
  int32 last_seen_loop = 5;
  repeated float lip_history = 6;  // last-3-loops iff include_history.
}
message Health {
  bool ready = 1;
  bool loop_locked = 2;
  // ok | resyncing | template_lost | trigger_lost | population_alarm | not_ready
  string status = 3;
  string detail = 4;
  // buffer_overflows_total, sequence_gaps_total, virtual_slots_total,
  // late_frames_total, frames_total
  map<string, double> counters = 5;
}

message GodetAlertEvent {
  string event_key = 1;          // stable DAMAGE:<godet_id>:<loop>
  string kind = 2;              // damage (MVP)
  int32 godet_id = 3;
  int32 loop_no = 4;
  string state = 5;              // pending | confirmed
  string evidence_frame_id = 6;  // Tier-1 candidate frame, if retained
  google.protobuf.Timestamp occurred_at = 7;
  map<string, double> measurements = 8;
}
