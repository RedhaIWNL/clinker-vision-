syntax = "proto3";

package clinkervision.inference.v2;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/clinkervision/clinker-vision/internal/inference/gen/v2;inferencev2";

// Model service: dense-frames-in, per-frame measurements (Tier 1) + per-godet
// damage state (Tier 2). Contract v0.3 (accepted). BACKWARD-INCOMPATIBLE with v1.
service InferenceService {
  // Bidi stream, one persistent stream per inference worker. frame_id correlates
  // request/response; per-camera order is by sequence_no (reorder window: 64 frames).
  // Per-frame input errors do not abort the stream and receive no response.
  rpc Infer(stream InferenceRequest) returns (stream InferenceResponse);
  // Tier 2: the actual product. Per-godet state over identity + history.
  rpc GetGodetState(GodetStateRequest) returns (GodetStateResponse);
}

message InferenceRequest {
  string frame_id = 1;
  // CAM-1 (night godet lips) or CAM-4 (day side plates, only when the server runs with a
  // CAM-4 bundle). Anything else is dead-lettered. Each camera has its own sequence_no order.
  string camera_id = 2;
  bytes image_data = 3;  // dense full-frame JPEG, FFmpeg MJPEG -q:v 3, max 8 MB.
  google.protobuf.Timestamp captured_at = 4;  // source/decode capture time, not send time.
  uint64 sequence_no = 5;
}

message InferenceResponse {
  string frame_id = 1;
  // Compatibility ROI indicator (fixed box, identical on every detection) or empty.
  repeated Detection detections = 2;
  // Pinned keys: lit_L, lit_R, peak, dx, dy, slot, status_code.
  // status_code: readable=0, weak=1, edge=2, occluded=3.
  // CAM-4 pinned scalar keys: chain_step (px the chain moved since the previous frame),
  // chain_pos (px since the stream started), match_quality (0-1), chain_status
  // (moving=0, weak_view=1, stopped=2). CAM-4 Tier-1 never carries detections.
  map<string, float> scalar_measurements = 3;
  string model_version = 4;
  google.protobuf.Timestamp processed_at = 5;
  // CAM-4 only: earlier frames of this camera that show a strong fault spot. A spot is
  // known about 10 s after its frame, so the model hands the frame back here; the
  // pipeline keeps it as evidence (a later GodetAlertEvent names it by frame_id).
  repeated RetainedFrame retained_frames = 6;
}

message RetainedFrame {
  string frame_id = 1;
  uint64 sequence_no = 2;
  google.protobuf.Timestamp captured_at = 3;
  bytes image_data = 4;   // the JPEG exactly as the pipeline sent it
}

message Detection {
  string observation_target = 1;  // "GODET" (MVP)
  string fault_type = 2;          // "DAMAGE" (MVP)
  // confidence intentionally absent until a mapping is signed.
  BoundingBox bounding_box = 4;
}

// Fixed ROI indicator for the 2688x1520 CAM-1 night ROI. It is not localized damage.
message BoundingBox { float x = 1; float y = 2; float width = 3; float height = 4; }

message GodetStateRequest {
  repeated int32 godet_ids = 1;
  bool include_history = 2;
  string camera_id = 3;   // "" or CAM-1 = camera 1 (unchanged default); CAM-4 = camera 4
}
message GodetStateResponse {
  string model_version = 1;
  repeated GodetState godets = 2;
  Health health = 3;
  repeated GodetAlertEvent events = 4;  // replayable Tier-2 state changes
  string camera_id = 5;  // the camera this state is for (echo)
}
message GodetState {
  int32 godet_id = 1;
  // healthy | suspect | persistent | pending | confirmed
  string state = 2;
  float lip = 3;
  bool near_plate = 4;
  int32 last_seen_loop = 5;
  repeated float lip_history = 6;
  // CAM-4 only. CAM-4 states: healthy | suspect (latest pass strong) | confirmed
  // (typical severity over >= 2 passes at or above the bundle alarm). lip/near_plate
  // are CAM-1 only. CAM-4 godet ids are 1..1210 (the chain map's godet 0 is 1210).
  float severity = 7;                   // median relative severity of recent passes
  repeated float severity_history = 8;  // per pass, oldest first, iff include_history
  int32 passes_seen = 9;
}
message Health {
  bool ready = 1;
  bool loop_locked = 2;
  // ok | resyncing | template_lost | trigger_lost | population_alarm | not_ready
  string status = 3;
  string detail = 4;
  map<string, double> counters = 5;
}

message GodetAlertEvent {
  string event_key = 1;          // stable DAMAGE:<godet_id>:<loop> (CAM-1),
                                 // CAM-4:DAMAGE:<godet_id>:<loop> (CAM-4)
  // damage | wheel_gap | wheel_density | wheel_missing (wheel kinds: side-plate cameras,
  // WHEELS_PLAN.md). Wheel keys: <cam>:WHEEL_GAP:<first godet>, <cam>:WHEEL_DENSITY:<first
  // godet> (fixed chain pattern, raised once) and <cam>:WHEEL_MISSING:<godet>:<loop> (a change).
  // Wheel measurements: first_godet, last_godet, godets, wheels. Their evidence frame is a
  // picture of the unrolled chain handed back in retained_frames.
  string kind = 2;
  int32 godet_id = 3;
  int32 loop_no = 4;
  string state = 5;              // pending | confirmed
  string evidence_frame_id = 6;  // Tier-1 candidate frame, if retained
  google.protobuf.Timestamp occurred_at = 7;
  map<string, double> measurements = 8;
  // CAM-4: where the fault spot is in the evidence frame (normalized 0-1). Unset for
  // CAM-1, whose evidence box is the fixed ROI indicator.
  BoundingBox evidence_box = 9;
}
