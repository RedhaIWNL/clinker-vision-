server:
  bind_address: "127.0.0.1"
  web_port: 8080

cameras:
  - id: "CAM-1"
    enabled: true
    nvr_rtsp_url: "rtsp://admin:REDACTED@192.168.1.200:554/cam/realmonitor?channel=1&subtype=0"
    # Retained for config compatibility; the v2 CAM-1 lane is dense and does not sample.
    sample_interval_seconds: 1
    queue_capacity: 64
  - id: "CAM-2"
    enabled: false
    sample_interval_seconds: 1
    queue_capacity: 64
  - id: "CAM-3"
    enabled: false
    sample_interval_seconds: 1
    queue_capacity: 64
  # Day side plates (overlap fault). NVR channel 4 = camera 192.168.1.144, main stream
  # (2688x1520; the model refuses any other size). Its own hours: the calibration was
  # checked on 10:00 and 12:00 light only, so widen the window only after checking the
  # status card at the edges.
  - id: "CAM-4"
    enabled: false
    nvr_rtsp_url: "rtsp://admin:REDACTED@192.168.1.200:554/cam/realmonitor?channel=4&subtype=0"
    sample_interval_seconds: 1
    queue_capacity: 64
    schedule:
      enabled: true
      start: "09:00"
      stop: "16:00"
      timezone: "Africa/Casablanca"
  - id: "CAM-5"
    enabled: false
    sample_interval_seconds: 1
    queue_capacity: 64
  - id: "CAM-6"
    enabled: false
    sample_interval_seconds: 1
    queue_capacity: 64

model:
  grpc_address: "model:50051"
  request_timeout_seconds: 5
  state_poll_seconds: 1
  max_jpeg_bytes: 8000000

failure:
  dependency_timeout_seconds: 300

storage:
  sqlite_path: "/srv/clinker-vision/data/alerts.db"
  evidence_path: "/srv/clinker-vision/evidence"
  jpeg_quality: 85

retention:
  days: 365
  # Night-run shape: cap stored alerts; 0 = unlimited (default preserves current behavior).
  max_alerts: 1000

# Global operating window: cameras without their own `schedule` (CAM-1) only run
# inside [start, stop) in the given timezone; wraps midnight (20:00-04:00 = night run).
# Each camera runs, stops and reports on its own window.
schedule:
  enabled: true
  start: "20:00"
  stop: "04:00"
  timezone: "Africa/Casablanca"
