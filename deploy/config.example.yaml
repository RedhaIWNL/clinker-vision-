server:
  bind_address: "127.0.0.1"
  web_port: 8080

cameras:
  # CAM-1 was re-aimed (~2026-09-27): it now sees the chain end after the sprocket (the CAM-4 side).
  # The model serves it with the side-plate engine and bundle model/cam1new (loaded by docker-compose):
  # wheels and godet outside damage (cut / out of line), day and night. Almost 24 h: the window closes
  # one minute a day so the daily report CAM-1-day-<date>.md is written. Enable it as in RUN-CAM4.md 4c.
  - id: "CAM-1"
    enabled: false
    nvr_rtsp_url: "rtsp://admin:REDACTED@192.168.1.200:554/cam/realmonitor?channel=1&subtype=0"
    sample_interval_seconds: 1
    queue_capacity: 64
    schedule:
      enabled: true
      start: "06:01"
      stop: "06:00"
      timezone: "Africa/Casablanca"
  - id: "CAM-2"
    enabled: false
    sample_interval_seconds: 1
    queue_capacity: 64
  # Day side plates, the OTHER side of the chain (the mirror of CAM-4). NVR channel 3, main stream
  # (2688x1520). Calibrated on 2026-09-27 10:00-12:26 light only: widen the window only after
  # checking the status card at the edges. An empty conveyor is reported and not judged.
  - id: "CAM-3"
    enabled: false
    nvr_rtsp_url: "rtsp://admin:REDACTED@192.168.1.200:554/cam/realmonitor?channel=3&subtype=0"
    sample_interval_seconds: 1
    queue_capacity: 64
    schedule:
      enabled: true
      start: "09:00"
      stop: "16:00"
      timezone: "Africa/Casablanca"
  # Day side plates (overlap fault). NVR channel 4 = camera 192.168.1.144, main stream
  # (2688x1520; the model refuses any other size). Its own hours: the calibration was
  # checked on 10:00 and 12:00 light only, so widen the window only after checking the
  # status card at the edges.
  - id: "CAM-4"
    enabled: false
    nvr_rtsp_url: "rtsp://admin:REDACTED@192.168.1.200:554/cam/realmonitor?channel=4&subtype=0"
    sample_interval_seconds: 1
    queue_capacity: 64
    schedule:
      enabled: true
      start: "09:00"
      stop: "16:00"
      timezone: "Africa/Casablanca"
  - id: "CAM-5"
    enabled: false
    sample_interval_seconds: 1
    queue_capacity: 64
  - id: "CAM-6"
    enabled: false
    sample_interval_seconds: 1
    queue_capacity: 64

model:
  grpc_address: "model:50051"
  request_timeout_seconds: 5
  state_poll_seconds: 1
  max_jpeg_bytes: 8000000

failure:
  dependency_timeout_seconds: 300

storage:
  sqlite_path: "/srv/clinker-vision/data/alerts.db"
  evidence_path: "/srv/clinker-vision/evidence"
  jpeg_quality: 85

retention:
  days: 365
  # Night-run shape: cap stored alerts; 0 = unlimited (default preserves current behavior).
  max_alerts: 1000

# Global operating window: cameras without their own `schedule` (CAM-1) only run
# inside [start, stop) in the given timezone; wraps midnight (20:00-04:00 = night run).
# Each camera runs, stops and reports on its own window.
schedule:
  enabled: true
  start: "20:00"
  stop: "04:00"
  timezone: "Africa/Casablanca"
